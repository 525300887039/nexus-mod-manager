# Nexus Mod Manager — Cargo workspace 入口
#
# 本文件对应 OpenSpec 能力 `project-structure` 与 `core-context`。
#
# 当前 members：
#   - src-tauri/      Tauri 桌面应用（GUI binary，原生入口）
#   - crates/core/    无 Tauri 依赖的业务逻辑库
#
# 后续 CLI 化 change 将继续添加：
#   - crates/cli/     独立 CLI binary

[workspace]
members = ["src-tauri", "crates/core"]
resolver = "2"
