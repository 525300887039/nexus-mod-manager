[package]
name = "nmm-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nexus Mod Manager CLI binary（独立 console subsystem）"

[[bin]]
name = "nmm"
path = "src/main.rs"

[dependencies]
nmm-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 仅 Windows：调 CreateMutexW 检测 GUI 是否在跑（tauri-plugin-single-instance 用同名 Named Mutex）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
