[package]
name = "nmm-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nexus Mod Manager CLI binary（独立 console subsystem）"

[[bin]]
name = "nmm"
path = "src/main.rs"

[dependencies]
nmm-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
