[package]
name = "nmm-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nexus Mod Manager 业务逻辑核心库（无 Tauri 依赖）"

[lib]
name = "nmm_core"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
